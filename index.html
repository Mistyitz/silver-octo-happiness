    function executeInput(event, rawInput) {
      if (event) event.preventDefault();
      let input = rawInput || document.getElementById('user-input').value.trim();
      if (!input) return;

      const win = window.open('about:blank', '_blank');
      if (!win) {
        alert('Please allow pop-ups for this site to work.');
        return;
      }

      win.document.title = "Google";

      let isUrl = false;
      let formattedUrl = input;

      if (!/^https?:\/\//i.test(formattedUrl) && /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/i.test(formattedUrl)) {
        formattedUrl = 'https://' + formattedUrl;
        isUrl = true;
      } else if (/^https?:\/\//i.test(formattedUrl)) {
        isUrl = true;
      }

      if (isUrl) {
        win.document.body.style.margin = '0';
        win.document.body.style.height = '100vh';
        win.document.body.style.overflow = 'hidden';

        const iframe = win.document.createElement('iframe');
        iframe.style.border = 'none';
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.src = formattedUrl;
        win.document.body.appendChild(iframe);
      } else {
        let htmlContent = input;
        if (!input.includes('<html') && !input.includes('<script') && !input.includes('<div') && !input.includes('<p')) {
          htmlContent = `<script>${input}<\/script>`;
        }

        win.document.open();
        win.document.write(`
          <!DOCTYPE html>
          <html>
          <head><title>Google</title></head>
          <body>${htmlContent}</body>
          </html>
        `);
        win.document.close();
      }
    }

                text-align: right;
                padding: 10px;
                margin-bottom: 20px;
                outline: none;
                font-family: 'Press Start 2P', cursive;
                box-shadow: inset 2px 2px 0px rgba(0, 0, 0, 0.5);
              }
              .buttons {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
              }
              button {
                background: #2e1a40;
                color: #ffffff;
                border: 3px solid #a855f7;
                border-radius: 0px;
                padding: 16px;
                font-size: 0.9rem;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.05s;
                font-family: 'Press Start 2P', cursive;
                box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.5);
                text-transform: uppercase;
              }
              button:active {
                transform: translate(1px, 1px);
                box-shadow: 0px 0px 0px rgba(0, 0, 0, 0.5);
              }
              button:hover {
                background: #3d2354;
                border-color: #f97316;
              }
              button.op {
                color: #f97316;
              }
              button.equal {
                background: linear-gradient(135deg, #f97316, #a855f7);
                grid-column: span 2;
                border-color: #f97316;
              }
              button.clear {
                color: #ef4444;
              }
            </style>
          </head>
          <body>
            <div class="calculator">
              <input type="text" id="display" readonly value="0">
              <div class="buttons">
                <button class="clear" onclick="clearDisplay()">C</button>
                <button onclick="deleteLast()">DEL</button>
                <button class="op" onclick="appendOp('/')">/</button>
                <button class="op" onclick="appendOp('*')">*</button>
                <button onclick="appendNum('7')">7</button>
                <button onclick="appendNum('8')">8</button>
                <button onclick="appendNum('9')">9</button>
                <button class="op" onclick="appendOp('-')">-</button>
                <button onclick="appendNum('4')">4</button>
                <button onclick="appendNum('5')">5</button>
                <button onclick="appendNum('6')">6</button>
                <button class="op" onclick="appendOp('+')">+</button>
                <button onclick="appendNum('1')">1</button>
                <button onclick="appendNum('2')">2</button>
                <button onclick="appendNum('3')">3</button>
                <button onclick="appendNum('.')">.</button>
                <button onclick="appendNum('0')">0</button>
                <button class="equal" onclick="calculate()">=</button>
              </div>
            </div>
            <script>
              const display = document.getElementById('display');
              function clearDisplay() { display.value = '0'; }
              function deleteLast() {
                display.value = display.value.slice(0, -1);
                if (display.value === '') display.value = '0';
              }
              function appendNum(num) {
                if (display.value === '0' && num !== '.') {
                  display.value = num;
                } else {
                  display.value += num;
                }
              }
              function appendOp(op) {
                const last = display.value.slice(-1);
                if (['+', '-', '*', '/'].includes(last)) {
                  display.value = display.value.slice(0, -1) + op;
                } else {
                  display.value += op;
                }
              }
              function calculate() {
                try {
                  display.value = Function('"use strict"; return (' + display.value + ')')();
                } catch (e) {
                  display.value = 'Error';
                }
              }
            <\/script>
          </body>
          </html>
        `);
        win.document.close();
      } else {
        alert("Popup blocked! Please allow popups in your browser settings.");
      }
    });

    // Bookmarks Handling
    let bookmarks = JSON.parse(localStorage.getItem('lotus_bookmarks')) || [];
    const bookmarksList = document.getElementById('bookmarksList');
    const modalOverlay = document.getElementById('modalOverlay');

    function renderBookmarks() {
      bookmarksList.innerHTML = '';
      bookmarks.forEach((bm, index) => {
        const item = document.createElement('div');
        item.className = 'bookmark-item';

        const titleSpan = document.createElement('span');
        titleSpan.textContent = bm.title;
        titleSpan.addEventListener('click', () => executeInput(null, bm.content));

        const delBtn = document.createElement('span');
        delBtn.className = 'bookmark-delete';
        delBtn.textContent = '×';
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          bookmarks.splice(index, 1);
          localStorage.setItem('lotus_bookmarks', JSON.stringify(bookmarks));
          renderBookmarks();
        });

        item.appendChild(titleSpan);
        item.appendChild(delBtn);
        bookmarksList.appendChild(item);
      });
    }

    document.getElementById('openModalBtn').addEventListener('click', () => modalOverlay.style.display = 'flex');
    document.getElementById('cancelModalBtn').addEventListener('click', () => modalOverlay.style.display = 'none');

    document.getElementById('saveBookmarkBtn').addEventListener('click', () => {
      const title = document.getElementById('bmTitle').value.trim();
      const content = document.getElementById('bmContent').value.trim();

      if (title && content) {
        bookmarks.push({ title, content });
        localStorage.setItem('lotus_bookmarks', JSON.stringify(bookmarks));
        renderBookmarks();
        document.getElementById('bmTitle').value = '';
        document.getElementById('bmContent').value = '';
        modalOverlay.style.display = 'none';
      }
    });

    renderBookmarks();

    // Automated Wavy Canvas Mesh Background
    const canvas = document.getElementById('meshCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    let step = 0;
    function animateMesh() {
      ctx.clearRect(0, 0, width, height);
      step += 0.02;

      ctx.lineWidth = 2;
      const spacing = 40;

      // Draw horizontal wavy lines
      for (let y = 0; y < height; y += spacing) {
        ctx.beginPath();
        for (let x = 0; x < width; x += 10) {
          const waveY = y + Math.sin(x * 0.005 + step + y * 0.01) * 15;
          if (x === 0) ctx.moveTo(x, waveY);
          else ctx.lineTo(x, waveY);
        }
        ctx.strokeStyle = 'rgba(168, 85, 247, 0.15)';
        ctx.stroke();
      }

      // Draw vertical wavy lines
      for (let x = 0; x < width; x += spacing) {
        ctx.beginPath();
        for (let y = 0; y < height; y += 10) {
          const waveX = x + Math.cos(y * 0.005 + step + x * 0.01) * 15;
          if (y === 0) ctx.moveTo(waveX, y);
          else ctx.lineTo(waveX, y);
        }
        ctx.strokeStyle = 'rgba(249, 115, 22, 0.10)';
        ctx.stroke();
      }

      requestAnimationFrame(animateMesh);
    }

    animateMesh();
  </script>

</body>
</html>
